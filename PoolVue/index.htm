<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My App</title>
	<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
	<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
	<link rel="stylesheet" Type="text/css" href="example.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
	
	<div id="search">
		<label for="f-search">search:</label>
		<input type="text" id="f-search" name="f-search">
    </div>
	
	<div class="admin-panel">
		<div class="slidebar">
		<ul>
			<li>
				<a id="vuematchItem" class="vuematch" href="#">Matches<i class="sideicon fa fa-area-chart"></i></a>
			</li>
			<li>
				<a id="dashboardItem" class="dashboard" href="#">dashboard<i class="sideicon fa fa-area-chart"></i></a>
			</li>
			<li>
				<a id="appItem" class="app" href="#">Test API<i class="sideicon fa fa-cube"></i></a>
			</li>
			<li>
				<a id="vueformappItem" class="vueformapp" href="#">Login & token<i class="sideicon fa fa-file-text-o "></i></a>
			</li>
		</ul>  
		</div>	
	</div>
  
  
	<div class="mainContent">
	
		<div id="vuematch">
			{{ TurnamentId }}
		</div>
		
        <div id="dashboard">
        
			<!--svg id="mytest" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="300">
				<rect width="100" height="100" fill="#f06"></rect>
			</svg-->
		

			<table>
				<tr>
					<td style="vertical-align: top;">
						<p v-if="formdata.errors.length">	
							<b>Please correct the following error(s):</b>
							<ul>
								<li v-for="error in formdata.errors">{{ error.description }}</li>
							</ul>
						</p>
						
						<div>
							<label class="label">Tournament Name</label>
							<input type="text" v-model="formdata.tournamentname">
					
						</div>
						
						<div>
							<label class="label">Number of players</label>
							<input type="number"  min="3" v-on:change="onChangeNbPlayers($event)" v-model.number="formdata.tournamentplayers"/>
						</div>
						
						<div  v-for="(runde, index) in formdata.rundearray">
						
							<label class="label" for="navn">navn (index: {{index}})</label>
							<input type="text" name="navn" id="navn" v-model="runde.navn">
							
							<div>
								<label class="label">players in round</label>
								<input type="number"  min="3" v-model.number="runde.NbPlayers" disabled/>
							</div>
							
							<div v-if="runde.playstyle !== 'beerpot'">
								<label class="label">Bedst af:</label>
								<input type="number"  min="1" v-on:change="onChangeNbPlayers($event)" v-model.number="runde.BestOf"/>
							</div>
							
							<select class="form-control" v-on:change="onChange($event, index)" v-model="runde.selected">
								<option value="" selected></option>
								<option value="pool">Pulje</option>
								<option value="knockout">Knockout</option>
							</select>
							
							<div v-if="runde.selected === 'pool'">
								<input type="number"  min="2" v-on:change="onChangeNumber($event, index)" v-model.number="runde.puljesize"/>
								<div  v-for="n in runde.puljesize" >
									
									<select class="form-control" v-on:change="onChangeDirection($event)" v-model="runde.valsArray[n-1]">
										<option value="-1" >Lost</option>
										<option value="0">Won</option>
										<option v-for="(runde2, index2) in formdata.rundearray" v-if="index2 > index" :value="index2">{{runde2.navn}}</option>
									</select>
									
								</div>
								
								
								<div>
								<label class="label">afvikles som</label>
									<select class="form-control" v-on:change="onChangePlayStyle($event, index)" v-model="runde.playstyle">
										<option value="roundrobin" selected>Alle mod Alle</option>
										<option value="swiss">Swiss</option>
										<option value="beerpot">Bajer pot</option>
									</select>
								</div>
								
								<div v-if="runde.playstyle === 'swiss'">
									<label class="label">swiss antal runder</label>
									<input type="number"  min="2" :max='runde.puljesize-1' v-on:change="onChangeNbPlayers($event)" v-model.number="runde.swissNb"/>
								</div>
								
							</div>
							<div v-else-if="runde.selected === 'knockout'">
								
								
								<div  v-for="n in runde.puljesize" >
									
									<select class="form-control" v-on:change="onChangeDirection($event)" v-model="runde.valsArray[n-1]">
										<option value="-1" >Lost</option>
										<option value="0">Won</option>
										<option v-for="(runde2, index2) in formdata.rundearray" v-if="index2 > index" :value="index2">{{runde2.navn}}</option>
									</select>
									
								</div>
								
							</div>
							
							<div v-if="runde.selected === 'item2'">
				
							</div>
							
							<button v-on:click="removerunde(index)">Remove</button>
							
						</div>
						
						<div>
							<button v-on:click="addrunde">Tilføj runde</button>
						</div>
						
						<div>
							<button v-on:click="getdatapost">Save Data</button>
						</div>	
						
						<div>
							<button v-on:click="loaddatapost">Load Data</button>
						</div>	
						
						<div>
							<button v-on:click="apipostturnament">Create Tournament</button>
						</div>	
						
						
					</td>
					<td style="vertical-align: top;">
						<div class="debug">
							<pre><code>{{ $data }}</code></pre>
						</div>
					</td>
					<td style="vertical-align: top;">
						<div class="debug">
							<canvas id="canvas" width="1500" height="1500">
							</canvas>
							
							<pre><code>{{ $data.formdata.rundearray.length }}</code></pre>
						</div>
					</td>
				</tr>
			</table>	
			
        </div>
  
		<div id="app">
		{{ info }}
		
		<div>
			<button v-on:click="testpost">Test</button>
		</div>	 
		
		</div>
		
		<div id="vueformapp">
		
		<div>
			<label class="label" for="username">username</label>
			<input type="text" name="username" id="username" v-model="username">
        </div>
		
		<div>
			<label class="label" for="password">password</label>
			<input type="text" name="password" id="password" v-model="password">
        </div>
		
		<div id="foo"></div>
		
		<div>
			<button v-on:click="apipost">Post</button>
			<button v-on:click="dynamic">Dynamic</button>
		</div>	
		
		<div class="debug">
			<pre><code>{{ $data }}</code></pre>
		</div>
		
		</div>
		
	</div>
	
    <script src="index.js"></script>
  </body>
</html>
